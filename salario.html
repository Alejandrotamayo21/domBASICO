<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4: Salario de empleado</title>
</head>
<body>

  <a href="index.html">&larr; Volver al inicio</a>

  <h1>Ejercicio 4: Calcular el salario de un empleado</h1>

  <h2>Descripción del ejercicio</h2>
  <p>
    Se pide calcular el salario de un empleado a partir de las horas
    trabajadas y el valor de la hora, mostrando el resultado en el input
    de resultado.
  </p>

  <form>
    <p>
      <label>Horas trabajadas: <input type="number" id="horas" placeholder="Horas trabajadas"></label>
    </p>
    <p>
      <label>Valor por hora: <input type="number" id="valorHora" placeholder="Valor por hora"></label>
    </p>

    <p>
      <button type="button" onclick="calcularSalario()">Calcular salario</button>
    </p>

    <p>
      <label>Salario a pagar: <input type="text" id="salario" placeholder="Salario a pagar" readonly></label>
    </p>
  </form>

  <script src="salario.js"></script>
</body>
</html>
