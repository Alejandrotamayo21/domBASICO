<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3: Promedio de notas</title>
</head>
<body>

  <a href="index.html">&larr; Volver al inicio</a>

  <h1>Ejercicio 3: Calcular el promedio de 3 notas</h1>

  <h2>Descripción del ejercicio</h2>
  <p>
    Se pide calcular el promedio de 3 notas ingresadas por el usuario y
    mostrar el resultado en el input de resultado.
  </p>

  <form>
    <p>
      <label>Nota 1: <input type="number" step="0.1" id="nota1" placeholder="Nota 1"></label>
    </p>
    <p>
      <label>Nota 2: <input type="number" step="0.1" id="nota2" placeholder="Nota 2"></label>
    </p>
    <p>
      <label>Nota 3: <input type="number" step="0.1" id="nota3" placeholder="Nota 3"></label>
    </p>

    <p>
      <button type="button" onclick="calcularPromedio()">Calcular promedio</button>
    </p>

    <p>
      <label>Promedio: <input type="text" id="promedio" placeholder="Promedio" readonly></label>
    </p>
  </form>

  <script src="promedio.js"></script>
</body>
</html>
